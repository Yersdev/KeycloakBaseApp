services:
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak_server
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - DB_VENDOR=h2
      - DB_ADDR=h2:9092
      - DB_DATABASE=mydb
      - DB_USER=sa
      - DB_PASSWORD=password
    ports:
      - "8080:8080"  # Expose Keycloak on port 8080
    networks:
      - keycloak-network
    restart: unless-stopped

  h2:
    image: oscarfonts/h2:latest
    container_name: h2
    ports:
      - "9092:9092"  # Expose H2 DB on port 9092
    networks:
      - keycloak-network
    restart: unless-stopped

networks:
  keycloak-network:
    driver: bridge
